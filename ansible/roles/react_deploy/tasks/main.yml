---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Install unzip
  apt:
    name: unzip
    state: present

- name: Download React build from Nexus
  get_url:
    url: "{{ nexus_url }}"
    dest: /tmp/frontend-build.zip
    username: "{{ nexus_user }}"
    password: "{{ nexus_pass }}"
    force: yes

- name: Remove old web files
  file:
    path: "{{ web_root }}"
    state: absent

- name: Create web root directory
  file:
    path: "{{ web_root }}"
    state: directory
    mode: '0755'

- name: Unzip React build
  unarchive:
    src: /tmp/frontend-build.zip
    dest: "{{ web_root }}"
    remote_src: yes

- name: Fix permissions
  file:
    path: "{{ web_root }}"
    owner: www-data
    group: www-data
    recurse: yes

- name: Configure nginx for React routing
  copy:
    dest: /etc/nginx/sites-enabled/default
    content: |
      server {
          listen 80 default_server;
          root /var/www/html;
          index index.html;

          location / {
              try_files $uri /index.html;
          }
      }
  notify: restart nginx